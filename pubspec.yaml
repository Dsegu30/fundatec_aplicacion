name: fundatec
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.4.2
  local_auth: ^3.0.2
  timezone: ^0.10.1
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  flutter_secure_storage: ^11.2.0
  app_links: ^7.2.2
